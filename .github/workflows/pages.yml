# 把 front/kaifeng-night-tour 发布到 GitHub Pages 根路径。
# 产物根目录就是站点根，index.html 里的 css/、js/、assets/ 相对路径可直接访问。
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: front/kaifeng-night-tour

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
